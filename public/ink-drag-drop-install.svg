<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc">
  <title id="title">Drag and drop a .ink plugin</title>
  <desc id="desc">Animated guide: drag a .ink file onto the editor drop zone, watch install progress, then see the plugin appear.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4f7f6"/>
      <stop offset="100%" stop-color="#e7eeec"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="720" height="400" fill="url(#bg)"/>
  <rect x="48" y="40" width="624" height="320" rx="18" fill="#ffffff" stroke="#d7e3df" filter="url(#soft)"/>
  <rect x="72" y="64" width="180" height="14" rx="7" fill="#0f766e"/>
  <rect x="72" y="92" width="280" height="10" rx="5" fill="#cbd5e1"/>
  <rect x="72" y="114" width="220" height="10" rx="5" fill="#e2e8f0"/>
  <rect x="400" y="70" width="240" height="220" rx="16" fill="#f8fafc" stroke="#99f6e4" stroke-dasharray="8 8">
    <animate attributeName="stroke" values="#99f6e4;#0f766e;#99f6e4" dur="2.4s" repeatCount="indefinite"/>
  </rect>
  <text x="520" y="150" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#64748b">Drop to install</text>
  <g>
    <animateTransform attributeName="transform" type="translate" values="80,250; 460,160; 460,160; 80,250" keyTimes="0;0.45;0.75;1" dur="3.6s" repeatCount="indefinite"/>
    <rect x="0" y="0" width="88" height="72" rx="12" fill="#0f766e"/>
    <text x="44" y="32" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700" fill="#ecfdf5">.ink</text>
    <text x="44" y="54" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#99f6e4">excel</text>
    <circle cx="78" cy="68" r="7" fill="#0f172a"/>
  </g>
  <rect x="430" y="200" width="180" height="10" rx="5" fill="#e2e8f0"/>
  <rect x="430" y="200" width="180" height="10" rx="5" fill="#0f766e">
    <animate attributeName="width" values="0;180;180;0" keyTimes="0;0.45;0.75;1" dur="3.6s" repeatCount="indefinite"/>
  </rect>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.55;0.7;0.9;1" dur="3.6s" repeatCount="indefinite"/>
    <rect x="430" y="230" width="180" height="36" rx="10" fill="#ccfbf1" stroke="#0f766e"/>
    <text x="520" y="253" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#115e59">Ink Excel installed</text>
  </g>
</svg>
