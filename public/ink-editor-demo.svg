<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Ink editor demo</title>
  <desc id="desc">Animated preview of the Ink rich text editor with toolbar, typing caret, and slash menu.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7f4ef"/>
      <stop offset="100%" stop-color="#ebe6dd"/>
    </linearGradient>
    <filter id="elev" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="960" height="540" fill="url(#paper)"/>
  <rect x="90" y="48" width="780" height="444" rx="20" fill="#ffffff" stroke="#d6ddd8" filter="url(#elev)"/>
  <rect x="90" y="48" width="780" height="56" rx="20" fill="#f8fafc"/>
  <rect x="90" y="88" width="780" height="16" fill="#f8fafc"/>
  <g fill="#0f766e">
    <rect x="118" y="66" width="42" height="22" rx="6" opacity="0.9"/>
    <rect x="170" y="66" width="28" height="22" rx="6" opacity="0.55"/>
    <rect x="208" y="66" width="28" height="22" rx="6" opacity="0.55"/>
    <rect x="246" y="66" width="28" height="22" rx="6" opacity="0.55"/>
    <rect x="288" y="66" width="36" height="22" rx="6" opacity="0.35"/>
    <rect x="334" y="66" width="36" height="22" rx="6" opacity="0.35"/>
  </g>
  <text x="130" y="150" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" fill="#0f172a">Ink Editor</text>
  <text x="130" y="198" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" fill="#334155">A modern rich text editor for product docs and CMS.</text>
  <text x="130" y="236" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" fill="#334155">
    Nestable blocks, slash commands, and a clean API.
  </text>
  <rect x="130" y="214" width="3" height="22" fill="#0f766e">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0,0; 290,0; 290,0; 0,0" keyTimes="0;0.45;0.7;1" dur="4s" repeatCount="indefinite"/>
  </rect>
  <g>
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.35;0.45;0.85;1" dur="4.5s" repeatCount="indefinite"/>
    <rect x="150" y="270" width="220" height="160" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="170" y="302" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#64748b">Slash commands</text>
    <rect x="166" y="318" width="188" height="28" rx="8" fill="#ccfbf1"/>
    <text x="178" y="337" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#115e59">Heading</text>
    <text x="178" y="372" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#334155">Bullet list</text>
    <text x="178" y="404" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#334155">Table</text>
  </g>
  <rect x="560" y="280" width="250" height="140" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="584" y="308" width="120" height="12" rx="6" fill="#0f766e" opacity="0.85"/>
  <rect x="584" y="336" width="200" height="10" rx="5" fill="#cbd5e1"/>
  <rect x="584" y="358" width="170" height="10" rx="5" fill="#e2e8f0"/>
  <rect x="584" y="380" width="190" height="10" rx="5" fill="#e2e8f0"/>
</svg>
